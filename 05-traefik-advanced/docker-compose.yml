services:
  # keep-sorted start block=yes
  fiboservice:
    build:
      context: apps/fiboService/
      dockerfile: Dockerfile
    scale: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fiboservice.rule=Host(`fibo.docker.localhost`)"
      - "traefik.http.routers.fiboservice.entrypoints=http"
    depends_on:
      - socket-proxy
      - traefik
      - valkey
    networks:
      - proxy
  nextjs:
    build:
      context: apps/nextjs-redis/
      dockerfile: Dockerfile
    scale: 3
    environment:
      - REDIS_URL=valkey:6379
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.next.rule=Host(`next.docker.localhost`)"
      - "traefik.http.routers.next.entrypoints=http"
    depends_on:
      - socket-proxy
      - traefik
      - valkey
    networks:
      - proxy
  redisinsight:
    image: redis/redisinsight:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redisinsight.rule=Host(`redisinsight.docker.localhost`)"
      - "traefik.http.routers.redisinsight.entrypoints=http"
    depends_on:
      - socket-proxy
      - traefik
      - valkey
    networks:
      - proxy
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: 1
    networks:
      - proxy
  traefik:
    depends_on:
      - socket-proxy
    image: traefik:v3.3
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./traefik.yml:/traefik.yml
    networks:
      - proxy
  valkey:
    image: bitnami/valkey:latest
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    labels:
      - "traefik.enable=true"
    depends_on:
      - socket-proxy
      - traefik
    networks:
      - proxy
  whoami:
    image: traefik/whoami
    scale: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.docker.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=http"
      - "traefik.http.middlewares.http-ratelimit.ratelimit.average=1"
      - "traefik.http.middlewares.http-ratelimit.ratelimit.burst=2"
      - "traefik.http.middlewares.http-ratelimit.ratelimit.period=1"
      - "traefik.http.routers.whoami.middlewares=http-ratelimit@docker"
    depends_on:
      - socket-proxy
      - traefik
    networks:
      - proxy
  zipkin:
    image: openzipkin/zipkin-slim
    ports:
      - 9411:9411
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zipkin.rule=Host(`zipkin.docker.localhost`)"
    depends_on:
      - socket-proxy
      - traefik
    networks:
      - proxy
  # keep-sorted end

networks:
  proxy:
    name: proxy
