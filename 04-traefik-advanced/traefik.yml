api:
  insecure: true
  dashboard: true
  debug: false

entryPoints:
  http:
    address: ":80"
  https:
    address: ":443"

providers:
  docker:
    watch: true
    exposedByDefault: false
    network: "proxy"

# Traefik v3 dropped the per-vendor tracing backends (zipkin, jaeger, datadog,
# ...) and speaks OpenTelemetry only. Jaeger ingests OTLP natively on :4318.
tracing:
  serviceName: traefik
  otlp:
    http:
      endpoint: http://jaeger:4318/v1/traces
