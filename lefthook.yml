pre-push:
  parallel: true
  commands:
    # keep-sorted start block=yes
    alejandra:
      tags: [format]
      run: alejandra --check .
    compose-lint:
      tags: [lint]
      run: >
        yamllint 03-docker-compose/docker-compose.yml 04-traefik/docker-compose.yml 05-traefik-advanced/docker-compose.yml && docker-compose -f 03-docker-compose/docker-compose.yml config --quiet && docker-compose -f 04-traefik/docker-compose.yml config --quiet && docker-compose -f 05-traefik-advanced/docker-compose.yml config --quiet
    dprint:
      tags: [format]
      run: dprint fmt
    just-fmt:
      tags: [format]
      run: just --fmt
    keep-sorted:
      tags: [sort]
      run: keep-sorted --mode lint {push_files}
    # keep-sorted end
commit-msg:
  commands:
    cog:
      run: cog verify --file {1}
