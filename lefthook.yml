pre-push:
  parallel: true
  commands:
    # keep-sorted start block=yes
    alejandra:
      tags: [format]
      run: alejandra --check .
    compose-lint:
      tags: [lint]
      run: >
        yamllint 02-docker-compose/docker-compose.yml 03-traefik/docker-compose.yml 04-traefik-advanced/docker-compose.yml && podman-compose -f 02-docker-compose/docker-compose.yml config --quiet && podman-compose -f 03-traefik/docker-compose.yml config --quiet && podman-compose -f 04-traefik-advanced/docker-compose.yml config --quiet
    dprint:
      tags: [format]
      run: dprint fmt
    just-fmt:
      tags: [format]
      # Bare `just --fmt` only formats the justfile in the current directory -
      # the root one, which works without --unstable only because it sets it
      # itself. Loop so every workshop folder's justfile is formatted too.
      run: >
        for f in justfile */justfile; do just --unstable --fmt --justfile "$f"; done
    keep-sorted:
      tags: [sort]
      run: keep-sorted --mode lint {push_files}
    # keep-sorted end
commit-msg:
  commands:
    cog:
      run: cog verify --file {1}
